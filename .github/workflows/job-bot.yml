name: Job Bot

# Polls Naukri + LinkedIn, scores against resume, sends results to WhatsApp.
on:
  # 12:30 PM IST = 07:00 UTC, 9:30 PM IST = 16:00 UTC
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # allows committing state.json back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: python -m src.main

      - name: Persist state.json
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "job-bot"
            git config user.email "job-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update seen job ids"
            git push
          else
            echo "state.json unchanged"
          fi
