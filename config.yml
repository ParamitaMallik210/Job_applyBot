profile:
  experience_years: 2
  min_ctc_lpa: 15
  locations:
    - Bengaluru
    - Bangalore
    - Hyderabad

# Whitelisted job titles. A posting matches if its title contains any of these
# (case-insensitive substring match). Description-based matching runs after this
# as a backup for postings with off-pattern titles.
title_whitelist:
  - Software Engineer
  - SDE
  - SDE-1
  - SDE 1
  - SDE I
  - Software Developer
  - Associate Software Engineer
  - Junior Software Engineer
  - Application Developer
  - Back End Developer
  - Backend Developer
  - Back End Engineer
  - Backend Engineer
  - Full Stack Developer
  - Fullstack Developer
  - Full Stack Engineer
  - Fullstack Engineer

# Postings with these terms in the title are dropped even if other filters pass.
title_blocklist:
  - Senior
  - Sr.
  - Lead
  - Principal
  - Staff
  - Architect
  - Manager
  - Director
  - Head
  - QA
  - SDET
  - Test Engineer
  - Data Scientist
  - DevOps
  - SRE
  - Intern

# A posting whose title is NOT in the whitelist can still qualify if its JD
# contains at least this many of these phrases — handles oddly-titled listings.
jd_match:
  min_hits: 3
  phrases:
    - software engineer
    - software developer
    - backend
    - back-end
    - full stack
    - full-stack
    - application developer
    - 2 years
    - 1-3 years
    - 1 to 3 years
    - 2-4 years
    - rest api
    - microservices

sources:
  naukri:
    enabled: true
    pages_per_query: 3
  linkedin:
    enabled: true
    pages_per_query: 2

ats:
  # Edit these to reflect your actual skills. The keyword score rewards JDs that
  # overlap with this list; missing-from-JD skills are reported back to you.
  my_skills:
    - java
    - python
    - spring boot
    - rest api
    - microservices
    - mysql
    - postgresql
    - mongodb
    - aws
    - docker
    - kubernetes
    - git
    - linux
    - sql
    - kafka
    - redis
    - junit
  llm_suggestions: true
  llm_model: claude-sonnet-4-6

notify:
  digest_mode: true  # Batches all matches into one Telegram message per run
  min_score_to_notify: 40  # Skip notifications below this ATS match %

resume:
  path: resume/resume.pdf
