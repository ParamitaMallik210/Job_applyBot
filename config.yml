profile:
  experience_years: 2
  min_ctc_lpa: 14
  locations:
    - Bengaluru
    - Bangalore
    - Hyderabad

# Whitelisted job titles. A posting matches if its title contains any of these
# (case-insensitive substring match). Description-based matching runs after this
# as a backup for postings with off-pattern titles.
title_whitelist:
  - Software Engineer
  - SDE
  - SDE-1
  - SDE 1
  - SDE I
  - SDE-2
  - SDE 2
  - SDE II
  - SDE1
  - SDE2
  - Software Developer
  - Associate Software Engineer
  - Junior Software Engineer
  - Application Developer
  - Back End Developer
  - Backend Developer
  - Back End Engineer
  - Backend Engineer
  - Full Stack Developer
  - Fullstack Developer
  - Full Stack Engineer
  - Fullstack Engineer

# Postings with these terms in the title are dropped even if other filters pass.
title_blocklist:
  - Senior
  - Sr.
  - Lead
  - Principal
  - Staff
  - Architect
  - Manager
  - Director
  - Head
  - QA
  - SDET
  - Test Engineer
  - Data Scientist
  - DevOps
  - SRE
  - Intern

# A posting whose title is NOT in the whitelist can still qualify if its JD
# contains at least this many of these phrases — handles oddly-titled listings.
jd_match:
  min_hits: 3
  phrases:
    - software engineer
    - software developer
    - backend
    - back-end
    - full stack
    - full-stack
    - application developer
    - 2 years
    - 1-3 years
    - 1 to 3 years
    - 2-4 years
    - rest api
    - microservices

sources:
  naukri:
    enabled: true
    pages_per_query: 6
  linkedin:
    enabled: true
    pages_per_query: 4
  indeed:
    enabled: true
    pages_per_query: 2
  foundit:
    enabled: true
    pages_per_query: 2
  instahyre:
    enabled: true
    pages_per_query: 2
  hirist:
    enabled: true
    pages_per_query: 1

ats:
  # Tuned from Paramita's resume (C#/.NET/Azure stack at WiseTech Global +
  # blockchain experience). Edit freely as your resume evolves.
  my_skills:
    - c#
    - .net
    - asp.net
    - sql
    - t-sql
    - javascript
    - java
    - c++
    - solidity
    - node.js
    - express.js
    - react
    - react.js
    - web3.js
    - azure
    - docker
    - kubernetes
    - ci/cd
    - git
    - rest api
    - microservices
    - oop
    - solid principles
    - dependency injection
    - tdd
    - agile
    - distributed systems
    - nunit
    - xunit
    - blockchain
  llm_suggestions: false  # No Claude API key needed; keyword score still runs
  llm_model: claude-sonnet-4-6

notify:
  channel: telegram   # whatsapp | telegram | both
  digest_mode: true
  min_score_to_notify: 40

resume:
  path: resume/resume.pdf
